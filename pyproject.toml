[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "languagebind"
version = "0.1.0"
description = "LanguageBind: multimodal (video/audio/image/depth/thermal) embedding model aligned to text via language-based semantic alignment. Packaged for pip-installability with compatibility patches for modern transformers/torchvision/torchaudio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0,<5.0.0",
    "einops>=0.8.0",
    "peft>=0.11.0",
]

[project.optional-dependencies]
video = [
    "decord>=0.6.0",
    "opencv-python-headless>=4.5.0",
    "pytorchvideo>=0.1.5",
    "torchvision>=0.15.0",
]
audio = [
    "torchaudio>=0.13.0",
    "soundfile>=0.12.0",
]
all = [
    "languagebind[video,audio]",
]

[project.urls]
Homepage = "https://github.com/PKU-YuanGroup/LanguageBind"
Source = "https://github.com/embeddings-benchmark/languagebind"

[tool.hatch.build.targets.wheel]
packages = ["languagebind"]
